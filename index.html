  <style>
    :root {
      --primary-color: #00704A;
      --primary-dark: #004D33;
      --bg-color: #EFECE6;
      --paper-color: #FFFFFF;
      --text-color: #2C3E50;
      --border-color: #2C3E50;
      --accent-color: #D4AF37;
    }

    body { 
      font-family: 'Noto Sans TC', 'Zen Maru Gothic', sans-serif;
      background-color: var(--bg-color); 
      -webkit-tap-highlight-color: transparent; 
      overscroll-behavior-y: none; 
      user-select: none;
      font-weight: 500;
      color: var(--text-color);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      position: fixed;
    }
    
    #root {
      height: 100%;
      width: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .safe-area-top { padding-top: env(safe-area-inset-top); background-color: var(--primary-color); }
    .safe-area-bottom { padding-bottom: max(env(safe-area-inset-bottom), 20px); background-color: white; border-top: 2px solid var(--border-color); }
    
    .card-3d {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 4px 4px 0px var(--border-color);
      margin-bottom: 24px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-3d {
      background: var(--paper-color);
      border: 2px solid var(--border-color);
      box-shadow: 2px 4px 0px var(--border-color);
      border-radius: 8px;
      font-weight: 700;
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-3d:active {
      transform: translate(2px, 4px);
      box-shadow: 0px 0px 0px var(--border-color);
    }
    .btn-3d-primary {
      background: var(--primary-color);
      color: white;
    }
    .btn-3d-accent {
      background: var(--accent-color);
      color: #1A1A1A;
    }

    .input-minimal {
      background-color: #F8F9FA;
      border: 2px solid #E0E0E0;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .input-minimal:focus-within {
      border-color: var(--primary-color);
      background-color: #FFF;
      box-shadow: 2px 2px 0px var(--primary-color);
    }
    
    .washi-tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 16px;
      background-color: #D2B48C;
      border: 1px solid #A67C52;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      z-index: 20;
      opacity: 0.9;
    }
    
    .paper-texture { 
      background-color: #FAFAFA; 
      background-image: radial-gradient(#B0BEC5 1px, transparent 1px);
      background-size: 16px 16px;
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    input, select, textarea { font-size: 16px !important; font-family: 'Noto Sans TC', sans-serif; font-weight: 700; color: var(--text-color); }
    
    .snap-x-mandatory { scroll-snap-type: x mandatory; }
    .snap-center { scroll-snap-align: center; }
    
    .modal-backdrop {
      background-color: rgba(44, 62, 80, 0.7); 
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .stamp-animation { animation: stamp 0.3s ease-out forwards; border: 2px solid #D32F2F; color: #D32F2F;}
    @keyframes stamp {
      0% { transform: scale(2) rotate(-10deg); opacity: 0; }
      100% { transform: scale(1) rotate(-5deg); opacity: 0.85; }
    }

    .banner-font { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; letter-spacing: 2px; }

    @media print {
      body, #root { position: relative; height: auto; overflow: visible; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      body * { visibility: hidden; }
      #booklet-root, #booklet-root * { visibility: visible; }
      #booklet-root { position: absolute; left: 0; top: 0; width: 100%; z-index: 9999; background: white; color: black; font-family: 'Noto Sans TC', sans-serif; }
      .page-break { page-break-before: always; }
      .avoid-break { page-break-inside: avoid; }
      .safe-area-top, .safe-area-bottom, .modal-backdrop, .print-hidden { display: none !important; }
      .no-print { display: none !important; }
    }
    
    .loading-spin { animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

    const callGeminiAPI = async (prompt) => {
        if (!apiKey) { alert("請先設定 API Key 才能使用 AI 功能"); return ""; }
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: prompt }] }] };
        const delays = [1000, 2000, 4000, 8000, 16000];
        for (let i = 0; i <= 5; i++) {
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
            } catch (error) { if (i === 5) throw error; await new Promise(resolve => setTimeout(resolve, delays[i])); }
        }
    };

      const compressImage = (file) => {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width; let height = img.height;
                    if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file);
        });
      };

      const handleFileSelect = async (e) => {
        const file = e.target.files[0]; if (!file) return; setIsScanning(true);

                 const base64 = await compressImage(file);
                 setShoppingList(shoppingList.map(item => item.id === targetDayId ? { ...item, photo: base64 } : item));

                const { data: { text } } = await Tesseract.recognize(file, 'eng+chi_tra');
                if (scanType === 'receipt') {
                    const numbers = text.match(/\d{1,3}(,\d{3})*(\.\d+)?/g) || [];
                    const cleanNumbers = numbers.map(n => parseFloat(n.replace(/,/g, ''))).filter(n => n > 2 && n < 1000000); 
                    const maxAmount = cleanNumbers.length > 0 ? Math.max(...cleanNumbers) : '';
                    let guessedCategory = '🍜 飲食';
                    const lowerText = text.toLowerCase();
                    if (lowerText.includes('zara') || lowerText.includes('h&m') || lowerText.includes('walmart') || lowerText.includes('shop')) guessedCategory = '🛍️ 購物';
                    else if (lowerText.includes('bus') || lowerText.includes('train') || lowerText.includes('taxi') || lowerText.includes('uber') || lowerText.includes('ticket')) guessedCategory = '🚃 交通';
                    else if (lowerText.includes('hotel') || lowerText.includes('inn') || lowerText.includes('suites') || lowerText.includes('hostel')) guessedCategory = '🏨 住宿';
                    setNewExpense(prev => ({ ...prev, amount: maxAmount || prev.amount, category: guessedCategory, note: 'OCR收據辨識' }));
                    alert(`辨識完成\n偵測金額: $${maxAmount}\n分類: ${guessedCategory}`);
                } else if (scanType === 'itineraryImport' && targetDayId) {
                    const lines = text.split('\n');
                    const newItems = [];
                    lines.forEach(line => {
                        const timeMatch = line.match(/(\d{1,2})[:：\.]?(\d{2})/);
                        if (timeMatch) {
                            let h = timeMatch[1]; let m = timeMatch[2];
                            if(parseInt(h) < 24 && parseInt(m) < 60) {
                                const time = `${h.padStart(2,'0')}:${m}`;
                                const activity = line.replace(timeMatch[0], '').trim();
                                if(activity && activity.length > 1) { 
                                    newItems.push({ id: Date.now() + Math.random(), time: time, category: '景點', activity: activity, note: 'OCR 匯入' }); 
                                }
                            }
                        }
                    });
                    if(newItems.length > 0) {

                         });

                    } else { alert('未能辨識出時間格式 (如 14:00)'); }
                }
            }

                          <td className="py-2 text-sm font-mono font-bold text-[#00704A] text-right" contentEditable suppressContentEditableWarning>{e.currency} {e.amount}</td>

          {showSettingsModal && <SettingsModal />}
          {showExpenseModal && <ExpenseModal />}

                                                                <input value={item.activity} onChange={(e) => updateScheduleItem(day.id, item.id, 'activity', e.target.value)} className="flex-1 bg-transparent border-none outline-none text-base font-bold text-gray-900 min-w-0" placeholder="Activity..." /> 
                                                            </div>

                                                                <button onClick={() => removeScheduleItem(day.id, item.id)} className="text-gray-300 hover:text-red-500 shrink-0"><Icons.Trash2 size={14}/></button> 
                                                            </div> 
                                                        </div> 
                                                    </div>

                <div className="bg-white p-5 border-2 border-[#2C3E50] rounded-lg shadow-[4px_4px_0_#2C3E50]"><div className="flex justify-between items-center mb-4 border-b-2 border-[#2C3E50] pb-2"><h3 className="font-bold text-sm text-[#00704A] uppercase tracking-widest flex items-center gap-2"><Icons.Bed size={16}/> ACCOMMODATION</h3><button onClick={() => setShowAddHotel(!showAddHotel)} className="text-[#2C3E50] text-xs font-bold hover:underline">{showAddHotel ? 'CANCEL' : '+ ADD'}</button></div>{showAddHotel && (<div className="bg-[#EFECE6] p-3 mb-4 border border-[#2C3E50] rounded"><div className="flex flex-col gap-1 mb-2"><label className="text-[10px] text-gray-500 font-bold uppercase tracking-widest">CHECK-IN</label><input type="date" value={newHotel.date} onChange={e => setNewHotel({...newHotel, date: e.target.value})} className="border-b-2 border-[#2C3E50] bg-transparent outline-none font-mono text-sm py-1" /></div><input placeholder="Hotel Name" value={newHotel.name} onChange={e => setNewHotel({...newHotel, name: e.target.value})} className="w-full border-b-2 border-[#2C3E50] bg-transparent mb-2 outline-none font-bold text-sm py-1" /><input placeholder="Address" value={newHotel.address} onChange={e => setNewHotel({...newHotel, address: e.target.value})} className="w-full border-b border-gray-300 bg-transparent mb-2 outline-none text-xs py-1" /><input placeholder="Booking # / Note" value={newHotel.note} onChange={e => setNewHotel({...newHotel, note: e.target.value})} className="w-full border-b border-gray-300 bg-transparent mb-3 outline-none text-xs text-gray-500 py-1" /><button onClick={handleAddHotel} className="btn-3d bg-[#2C3E50] text-white w-full py-1.5 text-xs">SAVE</button></div>)}<div className="space-y-4">{(accommodations || []).sort((a,b) => new Date(a.date) - new Date(b.date)).map(h => (<div key={h.id} className="relative group"><div className="flex flex-col"><div className="flex items-center gap-2 mb-1">{h.date && <span className="text-[10px] font-mono font-bold bg-[#2C3E50] text-white px-1.5 py-0.5 rounded">{formatDate(h.date)}</span>}<span className="font-bold text-base text-[#2C3E50]">{h.name}</span></div>{h.address && <button onClick={(e) => openGoogleMaps(e, h.address)} className="text-[#00704A] text-[10px] font-bold flex items-center gap-1 mb-1 hover:underline"><Icons.Map size={10}/> {h.address}</button>}{h.note && <div className="text-xs text-gray-500 bg-gray-50 p-1.5 border-l-2 border-[#D4AF37] mt-1">{h.note}</div>}</div><button onClick={() => handleDeleteHotel(h.id)} className="absolute top-0 right-0 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Trash2 size={14}/></button></div>))}</div></div>
                
                <div className="bg-white p-5 border-2 border-[#2C3E50] rounded-lg shadow-[4px_4px_0_#2C3E50]"><div className="flex justify-between items-center mb-4 border-b-2 border-[#2C3E50] pb-2"><h3 className="font-bold text-sm text-[#00704A] uppercase tracking-widest flex items-center gap-2"><Icons.Ticket size={16}/> TICKETS & RESV.</h3><button onClick={() => setShowAddReserv(!showAddReserv)} className="text-[#2C3E50] text-xs font-bold hover:underline">{showAddReserv ? 'CANCEL' : '+ ADD'}</button></div>{showAddReserv && (<div className="bg-[#EFECE6] p-3 mb-4 border border-[#2C3E50] rounded"><input placeholder="Title (e.g. Train to Rockies)" value={newReserv.title} onChange={e => setNewReserv({...newReserv, title: e.target.value})} className="w-full border-b-2 border-[#2C3E50] bg-transparent mb-2 outline-none font-bold text-sm py-1" /><div className="flex flex-col gap-1 mb-2"><label className="text-[10px] text-gray-500 font-bold uppercase tracking-widest">DATE & TIME</label><input type="datetime-local" value={newReserv.time} onChange={e => setNewReserv({...newReserv, time: e.target.value})} className="border-b border-gray-300 bg-transparent outline-none font-mono text-xs py-1 w-full" /></div><input placeholder="Code / Seat / Note" value={newReserv.code} onChange={e => setNewReserv({...newReserv, code: e.target.value})} className="w-full border-b border-gray-300 bg-transparent mb-3 outline-none text-xs text-gray-500 py-1" /><button onClick={handleAddReserv} className="btn-3d bg-[#2C3E50] text-white w-full py-1.5 text-xs">SAVE</button></div>)}<div className="space-y-4">{(reservations || []).sort((a,b) => new Date(a.time) - new Date(b.time)).map(r => (<div key={r.id} className="relative group"><div className="flex flex-col"><div className="flex items-center gap-2 mb-1">{r.time && <span className="text-[10px] font-mono font-bold border border-[#00704A] text-[#00704A] px-1.5 py-0.5 rounded">{new Date(r.time).toLocaleString([], {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>}<span className="font-bold text-sm text-[#2C3E50]">{r.title}</span></div>{r.code && <div className="text-sm font-mono font-bold text-[#D4AF37] bg-gray-50 px-2 py-1 w-fit border border-[#EFECE6] mt-1">{r.code}</div>}</div><button onClick={() => handleDeleteReserv(r.id)} className="absolute top-0 right-0 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Trash2 size={14}/></button></div>))}</div></div>
                
                <div className="bg-white p-5 border-2 border-[#2C3E50] rounded-lg shadow-[4px_4px_0_#2C3E50]"><div className="flex justify-between items-center mb-4 border-b-2 border-[#2C3E50] pb-2"><h3 className="font-bold text-sm text-[#00704A] uppercase tracking-widest flex items-center gap-2"><Icons.Utensils size={16}/> GOURMET LIST</h3><button onClick={() => setShowAddGourmet(!showAddGourmet)} className="text-[#2C3E50] text-xs font-bold hover:underline">{showAddGourmet ? 'CANCEL' : '+ ADD'}</button></div>{showAddGourmet && (<div className="bg-[#EFECE6] p-3 mb-4 border border-[#2C3E50] rounded"><div className="flex gap-2 mb-2"><select value={newGourmet.city} onChange={e => setNewGourmet({...newGourmet, city: e.target.value})} className="bg-transparent border-b-2 border-[#2C3E50] text-xs font-bold outline-none">{CITIES.map(c => <option key={c} value={c}>{c}</option>)}</select><input placeholder="Restaurant Name" value={newGourmet.name} onChange={e => setNewGourmet({...newGourmet, name: e.target.value})} className="flex-1 border-b-2 border-[#2C3E50] bg-transparent outline-none font-bold text-sm py-1" /></div><input placeholder="Location / Address" value={newGourmet.location} onChange={e => setNewGourmet({...newGourmet, location: e.target.value})} className="w-full border-b border-gray-300 bg-transparent mb-2 outline-none text-xs py-1" /><div onClick={() => triggerFileAction('gourmetPhoto', 'new')} className="w-full h-20 bg-gray-100 border border-dashed border-gray-300 flex items-center justify-center mb-2 cursor-pointer hover:border-[#00704A] transition-colors rounded">{newGourmet.photo ? <img src={newGourmet.photo} className="w-full h-full object-cover"/> : <span className="text-gray-400 text-[10px] uppercase font-bold tracking-widest flex items-center gap-1"><Icons.Camera size={12}/> UPLOAD PHOTO</span>}</div><input placeholder="Must eat / Note" value={newGourmet.note} onChange={e => setNewGourmet({...newGourmet, note: e.target.value})} className="w-full border-b border-gray-300 bg-transparent mb-3 outline-none text-xs text-gray-500 py-1" /><button onClick={handleAddGourmet} className="btn-3d bg-[#2C3E50] text-white w-full py-1.5 text-xs">SAVE</button></div>)}<div className="grid grid-cols-2 gap-4">{(gourmetList || []).map(g => (<div key={g.id} className="group relative flex flex-col gap-2"><div onClick={() => triggerFileAction('gourmetPhoto', g.id)} className="h-24 bg-gray-100 w-full relative cursor-pointer border-2 border-[#2C3E50] rounded shadow-[2px_2px_0_#2C3E50] hover:shadow-none hover:translate-y-px transition-all overflow-hidden">{g.photo ? <img src={g.photo} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center text-gray-300"><Icons.Utensils size={24}/></div>}<span className="absolute top-1 left-1 bg-[#2C3E50] text-white text-[9px] font-bold tracking-widest px-1.5 py-0.5 rounded">{g.city}</span></div><div className="flex flex-col"><div className="font-bold text-[#2C3E50] text-sm leading-tight mb-0.5 truncate">{g.name}</div>{g.location && <button onClick={(e) => openGoogleMaps(e, g.location)} className="text-[#00704A] text-[9px] font-bold hover:underline flex items-center gap-1 mb-1 truncate w-full text-left"><Icons.Map size={10} className="shrink-0"/> {g.location}</button>}{g.note && <div className="text-[10px] text-gray-500 truncate">{g.note}</div>}</div><button onClick={() => handleDeleteGourmet(g.id)} className="absolute -top-2 -right-2 bg-white text-gray-300 border border-gray-300 rounded-full p-1 opacity-0 group-hover:opacity-100 hover:text-red-500 transition-opacity z-10"><Icons.Trash2 size={12}/></button></div>))}</div></div>
                
                <div className="flex flex-col">
                    <h3 className="font-bold text-sm tracking-widest uppercase text-[#00704A] mb-4 border-b-2 border-[#00704A] pb-2 flex items-center gap-2"><Icons.ListPlus size={16}/> MEMO BOARD</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <div className="flex flex-col gap-4">
                            <button onClick={() => addMemo('left')} className="btn-3d bg-[#EFECE6] text-[#2C3E50] py-2 text-xs">+ ADD MEMO</button>
                            {memos.filter(m => m.column === 'left').map(memo => (
                                <div key={memo.id} className="bg-[#D5CDBA] p-3 shadow-md relative transform -rotate-1 hover:rotate-0 transition-transform">
                                    <div className="washi-tape"></div>
                                    <textarea className="w-full mt-2 bg-transparent resize-none outline-none text-[#2C3E50] font-bold text-sm leading-relaxed h-24" placeholder="Type..." value={memo.text} onChange={(e) => updateMemo(memo.id, 'text', e.target.value)}></textarea>
                                    <div onClick={() => triggerFileAction('memoPhoto', memo.id)} className="w-full h-24 bg-white/30 border border-[#A67C52] flex items-center justify-center cursor-pointer hover:bg-white/50 overflow-hidden relative group">
                                        {memo.photo ? <img src={memo.photo} className="w-full h-full object-cover grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all" /> : <div className="text-[#A67C52] text-[10px] font-bold tracking-widest flex flex-col items-center"><Icons.Camera size={16}/></div>}
                                    </div>
                                    <button onClick={() => deleteMemo(memo.id)} className="absolute -top-2 -right-2 text-gray-500 hover:text-red-600 bg-[#EFECE6] rounded-full p-0.5 border border-gray-300"><Icons.X size={14}/></button>
                                </div>
                            ))}
                        </div>
                        <div className="flex flex-col gap-4">
                            <button onClick={() => addMemo('right')} className="btn-3d bg-[#EFECE6] text-[#2C3E50] py-2 text-xs">+ ADD MEMO</button>
                            {memos.filter(m => m.column === 'right').map(memo => (
                                <div key={memo.id} className="bg-[#EFECE6] p-3 shadow-md relative transform rotate-1 hover:rotate-0 transition-transform border border-gray-300">
                                    <div className="washi-tape" style={{backgroundColor: '#5C6B73', borderColor: '#2C3E50'}}></div>
                                    <textarea className="w-full mt-2 bg-transparent resize-none outline-none text-[#2C3E50] font-bold text-sm leading-relaxed h-24" placeholder="Type..." value={memo.text} onChange={(e) => updateMemo(memo.id, 'text', e.target.value)}></textarea>
                                    <div onClick={() => triggerFileAction('memoPhoto', memo.id)} className="w-full h-24 bg-white border border-gray-300 flex items-center justify-center cursor-pointer hover:bg-gray-50 overflow-hidden relative group">
                                        {memo.photo ? <img src={memo.photo} className="w-full h-full object-cover grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all" /> : <div className="text-gray-400 text-[10px] font-bold tracking-widest flex flex-col items-center"><Icons.Camera size={16}/></div>}
                                    </div>
                                    <button onClick={() => deleteMemo(memo.id)} className="absolute -top-2 -right-2 text-gray-500 hover:text-red-600 bg-white rounded-full p-0.5 border border-gray-300"><Icons.X size={14}/></button>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
              </div>
            )}
          </div>

          <div className="bg-[#EFECE6] shrink-0 safe-area-bottom grid grid-cols-5 h-[72px] items-center px-2 z-50 relative border-t-4 border-[#2C3E50]">
            <TabButton id="itinerary" IconComp={Icons.Map} label="PLAN" />
            <TabButton id="expenses" IconComp={Icons.Coins} label="EXPENSE" />
            <TabButton id="shopping" IconComp={Icons.ShoppingBag} label="SHOP" />
            <TabButton id="packing" IconComp={Icons.Suitcase} label="PACK" />
            <TabButton id="info" IconComp={Icons.Info} label="INFO" />
          </div>

        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
